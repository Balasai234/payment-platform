name: Payment Platform Dev CI/CD
on:
  push:
    branches:
      - main
permissions:
    contents: write    
jobs:
  checkout:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
      - name: Build the application
        run: mvn clean package
      - name: Docker Buildx Setup
        uses: docker/setup-buildx-action@v3
      - name: Build the Docker image
        run: docker build -t payment-platform:${{ github.sha }} .
      - name: Scan Docker image for vulnerabilities
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: payment-platform:${{ github.sha }}
          format: 'table'
          exit-code: '0'
          severity: HIGH,CRITICAL
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v2
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: us-east-1
      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v1
      - name: Tag and Push Docker image to ECR
        env:
         REGISTRY: ${{ steps.login-ecr.outputs.registry }}
         REPOSITORY: payment-platform
         IMAGE_TAG: ${{ github.sha }}
        run: |
         docker tag payment-platform:${IMAGE_TAG} ${REGISTRY}/${REPOSITORY}:${IMAGE_TAG}
         docker push ${REGISTRY}/${REPOSITORY}:${IMAGE_TAG}
      - name: checkout GitOps repository
        uses: actions/checkout@v4
        with:
          repository: Balasai234/payment-platform-gitops
          path: payment-platform-gitops
          token: ${{ secrets.GITHUB_TOKEN }
            - name: Update image tag
        run: |
          cd payment-platform-gitops/payment-platform
          sed -i "s/newTag:.*/newTag: ${GITHUB_SHA}/" kustomization.yaml

      - name: Commit and push GitOps changes
        run: |
          cd payment-platform-gitops
          git config user.name "Balasai234"
          git config user.email "balasaicheni7@gmail.com"

          git add .
          git diff --cached --quiet || git commit -m "Update payment-platform image to ${GITHUB_SHA}"
          git push 