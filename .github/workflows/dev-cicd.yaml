name: Payment Platform Dev CI/CD
on:
  push:
    branches:
      - main
jobs:
  checkout:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
      - name: Build the application
        run: mvn clean package
      - name: Docker Buildx Setup
        uses: docker/setup-buildx-action@v3
      - name: Build the Docker image
        run: docker build -t payment-platform:${{ github.sha }} .
      - name: Scan Docker image for vulnerabilities
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: payment-platform:${{ github.sha }}
          format: 'table'
          exit-code: '0'
          severity: HIGH,CRITICAL
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v2
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: us-east-1
      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v1
      - name: Tag and Push Docker image to ECR
        env:
          REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          REPOSITORY: payment-platform
          IMAGE_TAG: ${{ github.sha }}
        run: |
          docker tag payment-platform:${{ github.sha }} ${{ secrets.ECR_REGISTRY }}/payment-platform:${{ github.sha }}
          docker push ${{ secrets.ECR_REGISTRY }}/payment-platform:${{ github.sha }}

